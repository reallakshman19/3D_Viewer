name: RVM PCF CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'viewer/tests/inputxml-direct-managed-stage.test.js'
      - 'viewer/tests/uxml-xml-compare-foundation.test.js'
      - 'viewer/tests/xml-compare-match-foundation.test.js'
      - 'viewer/converters/inputxml-managed-stage/**'
      - 'viewer/xml-compare/**'
      - '.github/workflows/rvm-pcf-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rvm-pcf-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Verify direct InputXML stagedJSON conversion
        run: node viewer/tests/inputxml-direct-managed-stage.test.js
